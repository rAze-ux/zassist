name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать Xcode-проект
        run: xcodegen generate

      - name: Архивировать приложение (без подписи)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ZAssist.xcodeproj \
            -scheme ZAssist \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZAssist.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Упаковать .ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/ZAssist.xcarchive/Products/Applications/ZAssist.app" build/Payload/
          cd build
          zip -qry ZAssist.ipa Payload
          ls -lh ZAssist.ipa

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ZAssist-ipa
          path: build/ZAssist.ipa
